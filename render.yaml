services:
  - type: web
    name: cpe-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: PASSWORD_RESET_TTL_HOURS
        value: "24"
      - key: EXPOSE_RESET_URL
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: SEED_DEMO
        value: "false"
